# ─── jibbit Medusa-Stack hinter einem bereits vorhandenen nginx ──────────────
#
# Für den Fall, dass auf der Maschine schon ein nginx die Ports 80/443 hält
# (etwa vor einer bestehenden Odoo-Instanz). Caddy kann dann nicht laufen —
# er würde an belegten Ports scheitern. Deshalb ist der caddy-Service im
# docker-compose.yml hinter dem Profil "caddy" versteckt und startet nicht
# von selbst.
#
# Installation:
#   sudo cp deploy/nginx/test.jibbit.ch.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/test.jibbit.ch.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Danach die Zertifikate holen — certbot ergänzt die TLS-Direktiven selbst
# und fasst dabei nur die hier definierten server-Blöcke an:
#   sudo certbot --nginx -d test.jibbit.ch -d api-test.jibbit.ch
#
# Voraussetzung: beide Namen zeigen per DNS bereits auf diese Maschine.

# Websocket-Upgrade korrekt weiterreichen.
#
# `Connection "upgrade"` fest zu setzen ist bei normalen Anfragen falsch: der
# Header gehoert nur gesetzt, wenn der Client tatsaechlich upgraden will.
# Sonst zerschiesst man die Keepalive-Verbindung zum Upstream. Diese map ist
# das uebliche Muster; sites-enabled wird innerhalb von http{} eingebunden,
# der Block ist hier also zulaessig.
map $http_upgrade $jibbit_connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Storefront ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name test.jibbit.ch;

    # ACHTUNG — der Host-Header MUSS unverändert durchgereicht werden.
    #
    # Die Storefront löst daraus den Tenant auf (proxy.ts -> lib/tenant/*).
    # Steht hier der Upstream-Name oder eine IP, findet sie keinen passenden
    # Eintrag in STATIC_TENANTS und antwortet auf JEDE Anfrage mit 404 —
    # bei laufendem, gesundem Container. Das ist die zeitraubendste Art,
    # diesen Fehler zu finden.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js streamt Server-Komponenten; Puffern verzögert die Ausgabe.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $jibbit_connection_upgrade;

        proxy_read_timeout 60s;
    }

    # Der Health-Endpunkt ist für den Container-Healthcheck gedacht, nicht
    # fürs Internet.
    location = /healthz {
        return 404;
    }
}

# ─── Medusa: API und Admin ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api-test.jibbit.ch;

    # Produktbilder und Importe laufen über das Admin-Interface.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $jibbit_connection_upgrade;

        # Migrationen und Importe über das Admin dauern länger als der
        # Standard von 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
