openapi: 3.1.0
info:
  title: jibbit.ch — Payrexx Payment Provider API
  description: |
    Spezifikation der Payrexx-Integration für jibbit.ch.
    Beschreibt den Payment-Flow (TWINT + Powerpay), Webhook-Handling und Security.
  version: 1.0.0
  contact:
    name: jibbit.ch
    url: https://jibbit.ch

servers:
  - url: https://api.jibbit.ch
    description: Production
  - url: http://localhost:9000
    description: Local Development

paths:
  /hooks/payment/payrexx:
    post:
      operationId: handlePayrexxWebhook
      summary: Payrexx Webhook Endpoint
      description: |
        Empfängt Webhook-Events von Payrexx bei Statusänderungen. Das ist die
        URL, die im Payrexx-Backend zu hinterlegen ist.

        Validiert die HMAC-SHA256-Signatur SYNCHRON und verarbeitet das Event
        idempotent. Anders als Medusas eingebaute Route
        `/hooks/payment/{provider}` (die hier `/hooks/payment/payrexx_payrexx`
        hiesse) antwortet dieser Endpunkt mit aussagekräftigen Statuscodes:
        ein 500 heisst ausdrücklich "bitte wiederholen".
      security: []
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: |
            HMAC-SHA256 des ROHEN Request-Body, lowercase hex-kodiert, mit dem
            Webhook-Secret als Schlüssel. Gross-/Kleinschreibung des Hex wird
            akzeptiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrexxWebhookEvent"
      responses:
        "200":
          description: |
            Verarbeitet, Duplikat, oder bewusst ignoriert. Payrexx soll nicht
            wiederholen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [authorized, failed, not_supported, duplicate]
        "400":
          description: Body unbrauchbar (kein JSON, kein transaction-Objekt)
        "401":
          description: Signatur ungültig — nicht wiederholen
        "500":
          description: |
            Vorübergehend gescheitert (typisch: der Webhook war schneller als
            die geschriebene Payment Session). Die Idempotenz-Reservierung
            wurde freigegeben; Payrexx SOLL wiederholen.
        "503":
          description: Payrexx-Zugangsdaten fehlen in der Umgebung

  /store/payrexx/return:
    post:
      operationId: reconcilePayrexxReturn
      summary: Rückkehr von der Payrexx-Bezahlseite abgleichen
      description: |
        Ruft die Storefront auf, sobald der Kunde von Payrexx zurückkommt.
        `initiatePayment()` hängt `?payment_session_id=...` an alle drei
        Rückkehr-URLs (success/failed/cancel).

        Der Endpunkt fragt den Stand AKTIV bei Payrexx ab und schliesst die
        Bestellung ab, falls das nicht schon der Webhook getan hat. Beide Wege
        teilen sich denselben Idempotenz-Schlüssel — die Arbeit passiert genau
        einmal. Der gemeldete Status stammt immer aus einer frischen
        Payrexx-Abfrage, nie aus dem, was der Browser behauptet.
      parameters:
        - name: x-publishable-api-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_session_id]
              properties:
                payment_session_id:
                  type: string
                  example: payses_01JABCDEF
      responses:
        "200":
          description: Aktueller Stand der Zahlung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrexxReturnStatus"
        "400":
          description: payment_session_id fehlt oder gehört nicht zu Payrexx
        "404":
          description: Payment Session unbekannt
        "409":
          description: Payment Session hat kein Payrexx-Gateway
        "500":
          description: |
            Bei Payrexx bestätigt, aber der Abschluss scheiterte. Der Webhook
            zieht nach; die Storefront darf das NICHT als Misserfolg anzeigen.
        "502":
          description: |
            Payrexx nicht erreichbar. Erneut versuchen — NICHT als Misserfolg
            anzeigen.
        "503":
          description: Payrexx-Zugangsdaten fehlen in der Umgebung

  /store/payment-collections/{id}/payment-sessions:
    post:
      operationId: initiatePayrexxPayment
      summary: Payment Session (Payrexx Gateway) erstellen
      description: |
        Erstellt einen Payrexx Gateway mit den in PAYREXX_ENABLED_PSPS
        freigegebenen Methoden (TWINT, Powerpay, Karten).
        Gibt in `data.link` die Redirect-URL zurück.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_id
              properties:
                provider_id:
                  type: string
                  example: pp_payrexx_payrexx
                context:
                  type: object
                  properties:
                    customer:
                      $ref: "#/components/schemas/CustomerContext"
      responses:
        "200":
          description: Payment Session erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSessionResponse"

components:
  schemas:
    PayrexxWebhookEvent:
      type: object
      required:
        - transaction
      properties:
        transaction:
          type: object
          required:
            - id
            - status
            - amount
          properties:
            id:
              type: integer
              description: Payrexx Transaction ID
            status:
              type: string
              enum:
                - waiting
                - confirmed
                - authorized
                - reserved
                - cancelled
                - declined
                - expired
                - refunded
                - partially-refunded
                - refundpending
                - chargeback
                - error
            amount:
              type: integer
              description: Betrag in Rappen (cents)
            referenceId:
              type: string
              description: Medusa Payment Session ID
            psp:
              type: string
              description: Verwendeter PSP (z.B. twint, powerpay)
            time:
              type: string
              format: date-time

    PayrexxReturnStatus:
      type: object
      properties:
        payment_session_id:
          type: string
        status:
          type: string
          description: |
            Medusa-Sicht auf die Zahlung.
            `authorized`/`captured` → Bestellung ist da, Danke-Seite zeigen.
            `pending` → noch nicht bezahlt, kurz warten und erneut abfragen.
            `canceled` → abgelehnt oder abgebrochen.
          enum: [pending, authorized, captured, canceled]
        transaction_status:
          type: string
          nullable: true
          description: Roher Payrexx-Status, für Logs und Support.

    CustomerContext:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email

    PaymentSessionResponse:
      type: object
      properties:
        payment_session:
          type: object
          properties:
            id:
              type: string
            provider_id:
              type: string
            data:
              type: object
              properties:
                id:
                  type: integer
                  description: Payrexx Gateway ID
                hash:
                  type: string
                  description: Gateway Hash
                link:
                  type: string
                  format: uri
                  description: Redirect-URL für TWINT/Powerpay Bezahlung
                status:
                  type: string
                referenceId:
                  type: string
                amountInRappen:
                  type: integer
                  description: |
                    Der an Payrexx gesendete Betrag in Rappen. Dient
                    updatePayment() als Vergleichswert, um ein unnötiges
                    Löschen+Neuanlegen des Gateways zu vermeiden.
                currency:
                  type: string
                  example: CHF

    ShippingRate:
      type: object
      description: |
        Schweizer Versandlogik:
        - Fixpreis: CHF 9.00
        - Ab CHF 100.00 Warenwert: CHF 0.00 (Gratisversand)
      properties:
        amount:
          type: integer
          description: Versandkosten in Rappen
          example: 900
        currency:
          type: string
          example: CHF
        is_free:
          type: boolean
          description: true wenn Warenwert >= 100.00 CHF

  securitySchemes:
    payrexxHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        HMAC-SHA256 des rohen Request-Body, lowercase hex, Schlüssel =
        PAYREXX_WEBHOOK_SECRET. (Der alte Header-Name `payrexx-signature`
        wird als Fallback noch akzeptiert, ist aber nicht der von Payrexx
        dokumentierte.)
