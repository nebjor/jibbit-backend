# jibbit.ch — Lokales Development Environment
# Stack: MedusaJS v2 + PostgreSQL 16 + Redis 7 + Caddy (Reverse Proxy + Auto-SSL)
#
# Usage:
#   docker compose up -d          → Alle Services starten
#   docker compose logs -f medusa → Medusa Logs verfolgen
#   docker compose down           → Alles stoppen

services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jibbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_dev_password}
    ports:
      # Nur Loopback, und der Host-Port ist verschiebbar.
      #
      # Auf einer Maschine, auf der schon eine andere Postgres-Instanz laeuft
      # (z.B. hinter einer bestehenden Odoo-Installation), scheitert der Start
      # sonst mit "address already in use". In der .env dann:
      #   POSTGRES_HOST_PORT=5433
      #
      # medusa erreicht die Datenbank ohnehin ueber das Compose-Netz, nicht
      # ueber diesen Port — er ist nur fuer Werkzeuge auf dem Host da.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jibbit-redis
    restart: unless-stopped
    # Redis ist hier KEIN Wegwerf-Cache mehr: Event-Bus und Workflow-Engine
    # legen ihre Warteschlangen darin ab (backend/src/lib/redis-modules.ts).
    # Ein Ereignis, das beim Neustart von Redis noch wartet, ist eine
    # Bestellbestaetigung, die sonst nie verschickt wird. Deshalb:
    #
    # --appendonly yes / --appendfsync everysec
    #   Ohne Konfiguration schreibt das Image nur RDB-Snapshots (fruehestens
    #   nach 60 s und 10000 Aenderungen, sonst nach 5 min bzw. 1 h) — bei
    #   einem Absturz ist alles seit dem letzten Snapshot weg. Mit AOF geht
    #   hoechstens die letzte Sekunde verloren. Die Snapshots bleiben
    #   zusaetzlich aktiv. Redis 7 uebernimmt beim ersten Start mit AOF den
    #   vorhandenen Snapshot, bestehende Sessions bleiben also erhalten.
    #
    # --maxmemory-policy noeviction
    #   Pflicht fuer BullMQ: jede andere Policy darf bei Speicherdruck
    #   beliebige Schluessel loeschen, also auch wartende Jobs. Mit noeviction
    #   lehnt Redis stattdessen Schreibzugriffe ab — das faellt im Log auf,
    #   ein still verschwundener Job nicht.
    #
    # --maxmemory
    #   Deckel, damit Redis auf der kleinen VPS nicht Postgres und Medusa den
    #   Speicher wegnimmt. Der Shop braucht wenige MB; in der .env anpassbar.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - noeviction
    ports:
      # Siehe postgres. Bei Konflikt in der .env:  REDIS_HOST_PORT=6380
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MedusaJS v2 Backend ───────────────────────────────────────
  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Heap-Limit fuer den Build. Siehe Kommentar im Dockerfile: auf einer
        # 2-GB-VPS reicht der V8-Default nicht, und Swap allein hilft nicht.
        NODE_BUILD_MEMORY: ${NODE_BUILD_MEMORY:-3072}
    container_name: jibbit-medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD:-medusa_dev_password}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}

      # CORS (Storefront + Admin)
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:5173,http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:5173,http://localhost:8000}

      # Medusa
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}

      # Session-Secrets: ohne diese fällt medusa-config.ts auf
      # "supersecret" zurück — in Produktion inakzeptabel.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET muss gesetzt sein}

      # zahls.ch — offizielles Plugin (@zahls/medusa-plugin).
      # Compose reicht NUR weiter, was hier ausdruecklich steht — ein Wert,
      # der nur in der .env existiert, erreicht den Container nie, und der
      # Fehler bleibt still (der Provider wird dann einfach nicht
      # registriert). Deshalb stehen alle ZAHLS_-Variablen hier.
      # UMBENENNUNG (03.09.2026, Umstieg aufs offizielle Plugin): der
      # API-Schluessel heisst ZAHLS_API_KEY, frueher ZAHLS_API_SECRET. Eine
      # .env mit dem alten Namen laesst den Provider still weg — jede
      # Zahlung endet in 500 unknown_error. Damit medusa-config.ts das
      # erkennen und bei NODE_ENV=production den Start abbrechen kann, werden
      # die alten Namen hier bewusst mit durchgereicht (leer = harmlos).
      # Webhook-Adresse im zahls.ch-Backend:
      #   https://<API_DOMAIN>/hooks/payment/zahls_zahls
      ZAHLS_API_SECRET: ${ZAHLS_API_SECRET:-}
      PAYREXX_INSTANCE: ${PAYREXX_INSTANCE:-}
      PAYREXX_API_SECRET: ${PAYREXX_API_SECRET:-}
      PAYREXX_WEBHOOK_SECRET: ${PAYREXX_WEBHOOK_SECRET:-}
      ZAHLS_INSTANCE: ${ZAHLS_INSTANCE:-}
      ZAHLS_API_KEY: ${ZAHLS_API_KEY:-}
      ZAHLS_WEBHOOK_SECRET: ${ZAHLS_WEBHOOK_SECRET:-}
      # Optionale Redirect-Ziele; leer = ${STORE_URL}/checkout/success|failed|cancel
      # (siehe backend/src/lib/zahls-plugin.ts, buildZahlsProviderOptions).
      ZAHLS_SUCCESS_URL: ${ZAHLS_SUCCESS_URL:-}
      ZAHLS_FAILED_URL: ${ZAHLS_FAILED_URL:-}
      ZAHLS_CANCEL_URL: ${ZAHLS_CANCEL_URL:-}

      # Store URL für Redirects — und Basis des Links in der
      # Passwort-zurücksetzen-E-Mail. Der Link wird bewusst NICHT aus dem
      # Host-Header gebaut: sonst liesse sich per gefälschtem Host eine echte
      # E-Mail von uns mit fremdem Ziel-Link auslösen.
      STORE_URL: ${STORE_URL:-http://localhost:8000}
      STORE_NAME: ${STORE_NAME:-jibbit}

      # SMTP (Infomaniak oder Resend)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@jibbit.ch}

      # Bestellungen: Betreiber-Mail und ntfy-Push (leer = kein Push)
      ORDER_NOTIFICATION_TO: ${ORDER_NOTIFICATION_TO:-joris@jibbit.ch}
      NTFY_URL: ${NTFY_URL:-}

      # Ablageort fuer hochgeladene Produktbilder. Muss mit dem Volume unten
      # uebereinstimmen — die ausfuehrliche Begruendung steht in
      # backend/medusa-config.ts.
      MEDUSA_UPLOAD_DIR: /app/static

      # Ablage der Stichtags-Schnappschuesse (Buchhaltung). Eigenes Volume und
      # bewusst NICHT unter /app/static: dieses Verzeichnis wird oeffentlich
      # ausgeliefert, die Schnappschuesse enthalten Einstandspreise.
      BUCHHALTUNG_DIR: /app/buchhaltung

      # Nur fuer einen lokalen Mailfaenger. Bei NODE_ENV=production ignoriert
      # der SMTP-Provider den Schalter hart.
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-}
    ports:
      # NUR Loopback. Dockers veroeffentlichte Ports umgehen ufw komplett —
      # "9000:9000" waere trotz Firewallregeln aus dem Internet erreichbar.
      # Caddy und nginx erreichen den Dienst so oder so.
      - "127.0.0.1:${MEDUSA_HOST_PORT:-9000}:9000"
    volumes:
      # /app/static, NICHT /app/uploads.
      #
      # Medusa serviert hochgeladene Dateien mit einer fest verdrahteten Zeile
      # (`express.static(path.join(baseDir, "static"))`), und der local-Provider
      # legt sie unter <cwd>/static ab. In /app/uploads schreibt niemand — das
      # Volume war leer, und jedes hochgeladene Bild lag im
      # Container-Dateisystem und war beim naechsten `docker compose up` weg.
      - medusa_data:/app/static
      # Stichtags-Schnappschuesse (docs/buchhaltung.md); in die Backups aufnehmen.
      - medusa_buchhaltung:/app/buchhaltung

  # ─── Storefront (Next.js 16) ───────────────────────────────────
  # Der Build-Context liegt im NACHBAR-Repository. Auf der VPS müssen
  # medusa-ecom und jibbit-frontend deshalb nebeneinander liegen —
  # scripts/vps-bootstrap.sh klont genau so. Anderer Ort? Dann
  # STOREFRONT_CONTEXT setzen.
  storefront:
    build:
      context: ${STOREFRONT_CONTEXT:-../jibbit-frontend}
      dockerfile: Dockerfile
      args:
        # Siehe medusa oben. `next build` ist der speicherhungrigste Schritt
        # im ganzen Stack.
        NODE_BUILD_MEMORY: ${NODE_BUILD_MEMORY:-3072}
    container_name: jibbit-storefront
    restart: unless-stopped
    depends_on:
      - medusa
    environment:
      NODE_ENV: production

      # Tenant-Auflösung. jibbit.ch wurde nie über die Control Plane
      # provisioniert — ohne diesen Eintrag beantwortet die Storefront in
      # Produktion JEDE Anfrage mit 404, weil der Dev-Fallback bei
      # NODE_ENV=production hart deaktiviert ist (Absicht, siehe
      # lib/tenant/local-fallback.ts).
      #
      # Der Publishable Key steht hier und nicht als NEXT_PUBLIC_* im Image:
      # NEXT_PUBLIC_* wird zur Build-Zeit eingebacken, und ein gemeinsam
      # genutztes Image darf keine tenant-spezifische Konfiguration enthalten.
      STATIC_TENANTS: ${STATIC_TENANTS:?STATIC_TENANTS muss gesetzt sein — sonst 404 auf allen Hosts}

      # PostHog (Analyse). BEIDE optional: fehlt der Schluessel, laedt die
      # Storefront posthog-js gar nicht erst — kein Fehler, nur ein Hinweis im
      # Serverlog.
      #
      # Diese Zeilen sind Pflicht, obwohl die Werte optional sind: Compose
      # reicht NUR weiter, was hier unter `environment:` steht. Ein Wert in der
      # .env erreicht den Container sonst nie, und der Fehler bleibt still —
      # genau das ist bei PAYREXX_API_BASE_URL schon einmal passiert.
      #
      # Bewusst ohne NEXT_PUBLIC_: solche Variablen werden zur Bauzeit ins
      # Image gebacken. Der Schluessel wird zur Laufzeit serverseitig gelesen.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      # Google Kundenrezensionen und Google-Profil (Werte in der .env; leer = aus).
      GOOGLE_KUNDENREZENSIONEN_MERCHANT_ID: ${GOOGLE_KUNDENREZENSIONEN_MERCHANT_ID:-}
      GOOGLE_KUNDENREZENSIONEN_BADGE: ${GOOGLE_KUNDENREZENSIONEN_BADGE:-0}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
      GOOGLE_PLACES_ENDPOINT: ${GOOGLE_PLACES_ENDPOINT:-}

      # Indexierungs-Schalter der Storefront (jibbit-frontend,
      # lib/seo/indexing.ts). Nur «true» macht die Seite indexierbar; leer,
      # falsch oder vertippt heisst noindex (Header, Meta-Tag, leere Sitemap).
      # Staging: leer lassen. PRODUKTION: SITE_INDEXABLE=true in .env — sonst
      # verschwindet der Shop aus Google. Wird zur Laufzeit gelesen, ein
      # Neustart des Containers genuegt.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-}

      BASE_DOMAIN: ${BASE_DOMAIN:-jibbit.app}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
    # Loopback-Port, damit auch ein Reverse-Proxy AUSSERHALB des Compose
    # drankommt (etwa ein bereits vorhandenes nginx, das 80/443 belegt).
    # Bewusst an 127.0.0.1 gebunden: auf 0.0.0.0 waere die Storefront direkt
    # aus dem Internet erreichbar und wuerde jeden Header und jedes Limit
    # umgehen, das der Proxy setzt.
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"

  # ─── Caddy (Reverse Proxy + Auto-SSL) ─────────────────────────
  # In Produktion: Automatisch Let's Encrypt Zertifikate
  # Lokal: HTTP-only (kein TLS nötig)
  caddy:
    image: caddy:2-alpine
    container_name: jibbit-caddy
    restart: unless-stopped
    # Nur mit `--profile caddy` starten.
    #
    # Caddy will 80 und 443. Laeuft auf der Maschine bereits ein anderer
    # Reverse-Proxy (etwa nginx vor einer bestehenden Odoo-Instanz), scheitert
    # der Start an belegten Ports — und ein beilaeufiges `docker compose up -d`
    # produziert dann einen verwirrenden Fehler statt eines laufenden Stacks.
    # Wer Caddy als Frontproxy will:  docker compose --profile caddy up -d
    profiles: ["caddy"]
    depends_on:
      - medusa
      - storefront
    environment:
      # Fuer welche Domains Caddy Zertifikate holt. Der Default ist der
      # produktive Zustand; im Testbetrieb in .env auf Testdomains setzen,
      # deren DNS bereits auf diese VPS zeigt.
      #
      # Eine Domain, deren DNS noch woanders zeigt, darf hier NICHT stehen:
      # Caddy versucht sofort ein Zertifikat, die ACME-Pruefung scheitert
      # wiederholt, und Let's Encrypt sperrt den Hostnamen fuer Stunden.
      SHOP_DOMAINS: ${SHOP_DOMAINS:-jibbit.ch, www.jibbit.ch}
      API_DOMAIN: ${API_DOMAIN:-api.jibbit.ch}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  medusa_data:
  medusa_buchhaltung:
  caddy_data:
  caddy_config:
